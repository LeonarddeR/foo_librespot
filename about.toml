# cargo-about: the third-party licence notices that ship inside the component, as licenses.html.
# Generated by `cargo xtask package`; the accepted licences match deny.toml's allow-list.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crates are publish = false; foo_librespot's licence ships as LICENSE.txt.
private = { ignore = true }
accepted = [
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSD-Source-Code",
	"ISC",
	"MIT",
	"MPL-2.0",
	"Unicode-3.0",
	"Zlib",
]
