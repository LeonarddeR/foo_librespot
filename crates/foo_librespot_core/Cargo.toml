[package]
name = "foo_librespot_core"
description = "Spotify playback through librespot for foo_librespot, with no foobar2000 knowledge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
futures-util = { workspace = true }
librespot-audio = { workspace = true }
librespot-core = { workspace = true }
librespot-metadata = { workspace = true }
librespot-oauth = { workspace = true }
librespot-protocol = { workspace = true }
log = { workspace = true }
protobuf = { workspace = true }
serde_json = { workspace = true }
symphonia = { workspace = true, features = ["mp3", "ogg", "vorbis"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
windows-core = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
