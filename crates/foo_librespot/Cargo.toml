[package]
name = "foo_librespot"
description = "A foobar2000 component that plays Spotify tracks, albums, playlists and podcasts through librespot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
foo_librespot_core = { path = "../foo_librespot_core" }
log = { workspace = true }
foxide2k = { path = "../foxide2k" }
foxide2k_ui = { path = "../foxide2k_ui" }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
foxide2k = { path = "../foxide2k", features = ["testing"] }
foxide2k_ui = { path = "../foxide2k_ui", features = ["testing"] }

[lints]
workspace = true

# cargo-release, for this crate only; see release.toml. The check runs fmt, clippy and the tests;
# cargo-release allows one hook command, so they are chained.
[package.metadata.release]
pre-release-hook = [
	"cmd",
	"/c",
	"cargo fmt --all -- --check && cargo lint && cargo nextest run --workspace --all-features",
]
pre-release-replacements = [
	{ file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
