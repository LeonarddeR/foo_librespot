# Nextest profile used by CI.
# Emits JUnit XML at target/nextest/ci/junit.xml for action-junit-report.

[profile.ci]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"
report-name = "foo_librespot"
store-success-output = false
store-failure-output = true

# Tests that create windows run one at a time. A window of another test process that takes the
# foreground takes keyboard focus from theirs, and some of them check where focus is.
[test-groups]
windows = { max-threads = 1 }

[[profile.default.overrides]]
filter = '(package(foo_librespot) & test(/^(prefs|login_window|window|open_playlist|playlist_window|status_line|artist_window|related|spotify_menu|playlist_menu|playing_menu|search_window)::/)) | (package(foxide2k) & test(/^preferences::/)) | (package(foxide2k_ui))'
test-group = 'windows'
