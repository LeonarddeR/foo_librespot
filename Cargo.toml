[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/LeonarddeR/foo_librespot"

[workspace.dependencies]

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
assert_is_empty = "allow"
cast_precision_loss = "allow"
items_after_statements = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
# Conflicts with rustc's unreachable_pub, so one of the two always fires.
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_long_first_doc_paragraph = "allow"
too_many_lines = "allow"
# GUIDs and SDK constants are copied digit for digit from the SDK; separators make them harder to check.
unreadable_literal = "allow"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "debuginfo"
# A panic must reach foobar2000 as a C++ exception, and foreign C++ exceptions
# must be able to unwind through Rust frames; panic = "abort" would kill the host.
panic = "unwind"
