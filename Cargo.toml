[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/LeonarddeR/foo_librespot"

[workspace.dependencies]
futures-util = { version = "0.3.34", default-features = false }
libloading = "0.9"
# librespot is pinned to a branch that combines PRs #1855 and #1844; see [patch.crates-io] below.
librespot-audio = { version = "0.8.0", default-features = false, features = ["native-tls"] }
librespot-core = { version = "0.8.0", default-features = false, features = ["native-tls"] }
librespot-metadata = { version = "0.8.0", default-features = false, features = ["native-tls"] }
librespot-oauth = { version = "0.8.0", default-features = false, features = ["native-tls"] }
librespot-protocol = "0.8.0"
http = "1.3"
log = "0.4.35"
# Only to build librespot-protocol messages in tests; keep it at the version librespot-protocol uses.
protobuf = "3.7.2"
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
windows-core = "0.100.0"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
assert_is_empty = "allow"
cast_precision_loss = "allow"
items_after_statements = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_long_first_doc_paragraph = "allow"
too_many_lines = "allow"
# GUIDs and SDK constants are copied digit for digit from the SDK; separators make them harder to check.
unreadable_literal = "allow"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
# A panic must reach foobar2000 as a C++ exception, and foreign C++ exceptions
# must be able to unwind through Rust frames; panic = "abort" would kill the host.
panic = "unwind"

# Two unreleased librespot fixes, merged on the foo_librespot branch of LeonarddeR/librespot:
# - Stock librespot calls std::process::exit(1) when a non-Premium account logs in, which would
#   close foobar2000. librespot-org/librespot PR #1855 shuts the session down instead.
# - Spotify refuses audio keys with code 2 when many are asked for at once, and asking again at
#   once keeps the refusals going. PR #1844 asks for keys one at a time and waits after a refusal.
# When both are released, drop this table.
[patch.crates-io]
librespot-audio = { git = "https://github.com/LeonarddeR/librespot", rev = "551f6562c4cb2e15bbd652c6cabb7240bbf0c843" }
librespot-core = { git = "https://github.com/LeonarddeR/librespot", rev = "551f6562c4cb2e15bbd652c6cabb7240bbf0c843" }
librespot-metadata = { git = "https://github.com/LeonarddeR/librespot", rev = "551f6562c4cb2e15bbd652c6cabb7240bbf0c843" }
librespot-oauth = { git = "https://github.com/LeonarddeR/librespot", rev = "551f6562c4cb2e15bbd652c6cabb7240bbf0c843" }
librespot-protocol = { git = "https://github.com/LeonarddeR/librespot", rev = "551f6562c4cb2e15bbd652c6cabb7240bbf0c843" }
