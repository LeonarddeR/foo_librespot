# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "trailing-whitespace" },
]

# The kjanat actionlint fork has no pre-commit hook release yet, so run the
# installed binary (winget kjanat.actionlint, or the v1.17.0 release).
[[repos]]
repo = "local"
hooks = [
  { id = "actionlint", name = "actionlint (kjanat fork)", entry = "actionlint", language = "system", files = '^\.github/workflows/', pass_filenames = false },
]

# fmt and clippy with the same flags CI uses, so test code is linted before it is pushed.
[[repos]]
repo = "local"
hooks = [
  { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all -- --check", language = "system", types = ["rust"], pass_filenames = false },
  { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --workspace --all-targets --all-features -- -D warnings", language = "system", types = ["rust"], pass_filenames = false },
]
