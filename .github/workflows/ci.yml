name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Check style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt -- --check
        run: cargo fmt --all -- --check

  bindings:
    name: Check generated bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/bindgen
      - name: Regenerate bindings
        run: cargo bindgen --locked
      - name: Check generated files are current
        run: git diff --exit-code

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: actionlint (kjanat fork)
        uses: kjanat/actionlint@v1.17.0

  clippy:
    name: Clippy
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      # --locked here and below: a Cargo.lock that is out of date with the manifests fails instead
      # of being re-resolved, so CI builds and cargo-deny audits the same dependencies.
      - name: cargo lint
        run: cargo --locked lint

  build:
    name: Build
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: build
      # Without the xtask: its zip dependency would add features to crates the DLL shares, so the
      # DLL built here would differ from the one the package ships, and be linked twice.
      - name: cargo build --release
        run: cargo build --locked --workspace --exclude xtask --release
      - name: Upload DLLs
        uses: actions/upload-artifact@v7
        with:
          name: dlls
          path: |
            target/release/*.dll
            target/release/*.pdb
          if-no-files-found: error
          compression-level: 9
      - name: Install cargo-about
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-about@0.9.3
      # The same package a release publishes, on every push, so a broken package or a dependency
      # whose licence can't be listed shows up long before a release.
      - name: cargo xtask package
        run: cargo --locked xtask package
      - name: Upload the component package
        uses: actions/upload-artifact@v7
        with:
          name: component
          path: |
            target/package/*.fb2k-component
            target/package/foo_librespot.pdb
          if-no-files-found: error
          compression-level: 0
      # On a tag, the notes are extracted here, where the xtask is already built. This fails when
      # CHANGELOG.md has no section for the version, so a release always has notes.
      - name: Extract the release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cargo --locked xtask release-notes "${GITHUB_REF_NAME#v}" > target/package/release-notes.md
      - name: Upload the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: target/package/release-notes.md
          if-no-files-found: error

  test:
    name: Test
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-nextest
      # The DLL tests load the built component DLLs, which nextest does not build.
      - name: Build the component DLLs
        run: cargo build --locked --workspace --all-features
      - name: Run tests
        run: cargo nextest run --locked --workspace --all-features --profile ci
      # A pull request from a fork gets a read-only token, which can't create the Tests check run,
      # so its results are reported as annotations instead.
      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Tests
          detailed_summary: true
          include_passed: false
          require_tests: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

  # Single required check for branch rulesets; fails if any needed job failed or was skipped.
  all-checks-pass:
    name: Check if all checks pass
    needs: [style, bindings, actionlint, clippy, build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check if all checks pass
        uses: re-actors/alls-green@v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}

  # On a version tag, publishes the package CI built, with that version's CHANGELOG.md section as
  # the notes. 0.x versions and versions with a pre-release suffix are published as pre-releases.
  release:
    name: Release
    needs: [all-checks-pass]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the component package
        uses: actions/download-artifact@v8
        with:
          name: component
          path: artifacts
      - name: Download the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # The package's name carries the crate version, so a tag that doesn't match it finds no file
      # and fails instead of publishing a package named for another version.
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: notes/release-notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/foo_librespot-${{ steps.version.outputs.version }}.fb2k-component
            artifacts/foo_librespot.pdb
