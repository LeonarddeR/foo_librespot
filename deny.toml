[graph]
all-features = true
# The component only ships for 64-bit Windows; dependencies for other platforms never reach it.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"
# All three come in through librespot-core and have no fix that librespot's version range allows.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Marvin attack needs private-key RSA operations; librespot only verifies the access point's signature with a public key" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml only parses the product-info XML Spotify's access point sends over the authenticated, encrypted connection; librespot-core pins quick-xml 0.38" },
    { id = "RUSTSEC-2026-0195", reason = "affects NsReader only; librespot-core uses quick_xml::Reader" },
]

[licenses]
# Workspace crates are publish = false; their licences are declared in their manifests.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-Source-Code",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the workspace crates have no version; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# librespot-org/librespot PR #1855's branch, pinned by commit in Cargo.toml until it is released.
allow-git = ["https://github.com/Neppkun/librespot"]
